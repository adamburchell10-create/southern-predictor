name: Sync fixtures and results

# This is the "automatic scraping" heartbeat: it's completely free (GitHub
# Actions gives every account thousands of free minutes/month, and this job
# takes a couple of seconds), and it's what keeps fixtures, results and the
# leaderboard up to date without you having to do anything.
on:
  schedule:
    # Every 30 minutes. GitHub may delay scheduled runs slightly at busy
    # times, but that's fine for a weekly amateur football fixture list.
    - cron: "*/30 * * * *"
  workflow_dispatch: {} # lets you trigger a sync manually from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call the app's sync endpoint
        run: |
          curl -sf -X POST "${{ secrets.APP_URL }}/api/cron/sync" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
